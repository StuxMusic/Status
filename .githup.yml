# Stux.Music Status: https://status.stux.music
# Asks GitHub for a check every 5 minutes (best-effort; GitHub often runs it less often) - .github/workflows/status.yml.
# Built with GitHup:
# https://github.com/StuxGroup/GitHup
site:
  name: Stux.Music Status
  description: Live status of Stux.Music's music sites and services, checked regularly.
  # Its own badge icon (the Stux.Music mark with a heartbeat badge), as on artists.stux.music.
  logo: https://artists.stux.music/assets/img/artists/stux-music-status.png
  favicon: https://artists.stux.music/assets/img/artists/stux-music-status.png
  accent: "#4752FF"
  url: https://status.stux.music/
  footer_links:
    - label: Stux.Music Artists
      url: https://artists.stux.music/
    - label: Report a problem
      url: https://github.com/StuxMusic/Status/issues/new

legal:
  operator: Stux.Music
  company: "Stux.Music is operated by Stux Group Ltd, a company registered in England and Wales (company no. 13160574), registered office 124 City Road, London, EC1V 2NX, England."
  contact: legal@stux.music
  host: GitHub Pages
  effective: 1 October 2026

defaults:
  timeout: 15
  retries: 2
  max_response_time: 15000  # ms; GitHup's default. Slower (but otherwise good) answers show as degraded

# Monitors are grouped into sections on the page, each with a combined status.
# Slugs come from the names, so moving a monitor between groups keeps its history.
groups:
  - name: Stux.Music
    description: The Stux.Music website and artist directory.
    monitors:
      - name: Stux.Music
        url: https://stux.music/
      # Full names; the slugs are pinned so each monitor keeps its history from before the rename.
      - name: Stux.Music Artists
        slug: artists
        url: https://artists.stux.music/
        description: The directory of Stux.Music artists
      - name: Stux.Music GitHub Pages Redirect
        url: https://stuxmusic.github.io/
        description: Sends the org's default GitHub Pages address to github.com/StuxMusic

  - name: Artists
    description: Sites for Stux.Music's artists.
    monitors:
      - name: Stux Sharp
        url: https://stuxsharp.com/
        description: The official website of Stux Sharp
      # A release page, not the index: sharp.stux.music/ can be set to redirect to stuxsharp.com.
      - name: Sharp.Stux.Music
        url: https://sharp.stux.music/human-enlightenment
        description: The smart-link portal for Stux Sharp releases
      - name: Stux Sharp Media CDN
        url: https://sharp.media.stux.music/icon.png
        description: Stux Sharp's logos and cover art, used by both of Stux Sharp's sites

  - name: Templates
    description: The holding pages shown while a Stux.Music site or artist page isn't ready.
    monitors:
      - name: Stux.Music Artistpage
        slug: artistpage
        url: https://artistpage.stux.music/
      - name: Stux.Music Soonpage
        slug: soonpage
        url: https://soonpage.stux.music/
      - name: Stux.Music Maintenancepage
        slug: maintenancepage
        url: https://maintenancepage.stux.music/

  - name: Shared
    description: The media everything Stux.Music runs relies on.
    monitors:
      - name: Stux.Music Media CDN
        url: https://global.media.stux.music/icon.png
        description: Shared logos and images used across every Stux.Music site

incidents:
  labels: [status]
